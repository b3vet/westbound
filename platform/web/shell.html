<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
<title>$GODOT_PROJECT_NAME</title>
<!--
	Westbound web shell (WP9.2, docs/WEB.md). Godot fills the $GODOT_* placeholders at
	export; tools/export_web.sh then fills __WB_BUILD__ (a hash of index.wasm and
	index.pck) and __WB_FONT__ (platform/web/wordmark.woff as base64). Built from the
	Godot 4.7 default shell, plus:
	- a loading screen in the title's look: ink background, the WESTBOUND wordmark and
	  CHASE THE SUN where the title draws them, an accent progress bar. After the
	  download the bar keeps moving (a stepped compositor-only CSS animation) while the engine
	  compiles and builds the world, which blocks the page's main thread;
	- cache busting: index.js, index.wasm and index.pck are fetched with ?v=<build>, so
	  a new deploy is never mixed with cached files, and version.json (never cached)
	  reloads a stale index.html once;
	- window.wbAudioCtx: the engine's AudioContext, for the audio unlock
	  (src/platform/web_audio_bridge.gd);
	- landscape only (WP9.7): on a touch device with a portrait viewport the game box
	  (#wb-rotor: the canvas and the loading screen) is sized to the landscape box
	  (the viewport's height by its width) and rotated 90° clockwise, so the phone's top
	  is on the player's left. The shell sizes the canvas itself (canvasResizePolicy 0)
	  and, while rotated, rewrites the touch and mouse coordinates the engine reads into
	  the box's own frame before the engine's listeners run. window.wbLayout tells the
	  game the rest (rotation for the gyro, safe-area insets): src/platform/web_layout.gd.
	Keep the ids status, status-progress and status-notice: tools/web_smoke/smoke.mjs
	watches #status and #status-notice.
-->
<style>
@font-face {
	font-family: 'WB Chakra';
	src: url(data:font/woff;base64,__WB_FONT__) format('woff');
	font-weight: 700;
	font-display: block;
}
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}
/* The game box: the canvas and the loading screen. The layout script sizes it and,
   on a portrait touch screen, rotates it (docs/WEB.md → Landscape only). Sizes inside
   follow the box (container units; vh/vw before them for older browsers). */
#wb-rotor {
	position: fixed;
	left: 0;
	top: 0;
	width: 100vw;
	height: 100vh;
	overflow: hidden;
	transform-origin: 0 0;
	container-type: size;
}
/* Reads env(safe-area-inset-*) for the layout script (viewport-fit=cover). */
#wb-safe {
	position: fixed;
	left: 0;
	top: 0;
	width: 0;
	height: 0;
	visibility: hidden;
	pointer-events: none;
	padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
}
body {
	color: #f4f7ff;
	background-color: #0b1020;
	overflow: hidden;
	touch-action: none;
}
#canvas {
	display: block;
}
#canvas:focus {
	outline: none;
}
#status {
	position: absolute;
	inset: 0;
	background-color: #0b1020;
	font-family: 'WB Chakra', 'Arial Narrow', Arial, sans-serif;
	font-weight: 700;
	opacity: 1;
	transition: opacity 0.25s ease-out;
	z-index: 1;
}
#status.gone {
	opacity: 0;
	pointer-events: none;
}
/* Left-anchored like the title (docs/SCREENS.md → Title): the logo top-left, the
   status bottom-left. Sizes follow the canvas height (the game's 720 px canvas). */
#wb-brand {
	position: absolute;
	left: max(4.2vw, env(safe-area-inset-left));
	left: max(4.2cqw, var(--wb-il, 0px));
	top: 8.5vh;
	top: 8.5cqh;
	transform: skewX(-7deg);
	transform-origin: left bottom;
}
#wb-logo {
	font-size: 13.3vh;
	font-size: 13.3cqh;
	line-height: 1;
	letter-spacing: 0.01em;
	text-shadow: 0.06em 0.06em 0 #1b2440;
}
#wb-tag {
	margin-top: 1.4vh;
	margin-top: 1.4cqh;
	margin-left: 0.3vh;
	margin-left: 0.3cqh;
	font-size: max(2.5vh, 11px);
	font-size: max(2.5cqh, 11px);
	letter-spacing: 0.08em;
	color: #31e5c0;
}
#wb-load {
	position: absolute;
	left: max(4.2vw, env(safe-area-inset-left));
	left: max(4.2cqw, var(--wb-il, 0px));
	bottom: max(9vh, env(safe-area-inset-bottom));
	bottom: max(9cqh, var(--wb-ib, 0px));
	width: min(38vw, 60vh);
	width: min(38cqw, 60cqh);
}
#wb-phase {
	font-size: max(2.2vh, 11px);
	font-size: max(2.2cqh, 11px);
	letter-spacing: 0.1em;
	color: #8a93ad;
	margin-bottom: 1.2vh;
	margin-bottom: 1.2cqh;
	white-space: nowrap;
}
#status-progress {
	position: relative;
	height: 0.55vh;
	height: 0.55cqh;
	min-height: 3px;
	background: #111a30;
	overflow: hidden;
	transform: skewX(-7deg);
}
#wb-fill {
	position: absolute;
	inset: 0;
	background: #31e5c0;
	transform-origin: left center;
	transform: scaleX(0);
	transition: transform 0.2s linear;
}
/* The engine compiles and builds the world with the main thread blocked: a
   transform-only animation runs on the compositor and keeps moving. Stepped (5 per
   second), not smooth: a 60 fps sweep made the browser composite every frame and
   slowed the boot by ~2 s under software rendering (docs/WEB.md). */
#wb-sweep {
	position: absolute;
	top: 0;
	bottom: 0;
	left: 0;
	width: 30%;
	background: linear-gradient(90deg, rgba(244, 247, 255, 0), rgba(244, 247, 255, 0.85), rgba(244, 247, 255, 0));
	transform: translateX(-100%);
	visibility: hidden;
	will-change: transform;
}
#status.starting #wb-sweep {
	visibility: visible;
	animation: wb-sweep 1.2s steps(6, jump-none) infinite;
}
@keyframes wb-sweep {
	from { transform: translateX(-100%); }
	to { transform: translateX(340%); }
}
/* Reduced motion (WP9.3): the game's own setting is not readable before the engine
   runs, so the shell follows the system's. No sweep: the whole bar breathes in opacity
   (compositor-only, stepped, under one change a second). docs/ACCESSIBILITY.md. */
@media (prefers-reduced-motion: reduce) {
	#status.starting #wb-sweep {
		left: 0;
		width: 100%;
		transform: none;
		opacity: 0.2;
		animation: wb-breathe 2.4s steps(2, jump-none) infinite;
	}
	#wb-fill {
		transition: none;
	}
}
@keyframes wb-breathe {
	from { opacity: 0.12; }
	to { opacity: 0.4; }
}
#status-notice {
	display: none;
	position: absolute;
	left: max(4.2vw, env(safe-area-inset-left));
	left: max(4.2cqw, var(--wb-il, 0px));
	right: 4.2vw;
	right: max(4.2cqw, var(--wb-ir, 0px));
	bottom: max(20vh, env(safe-area-inset-bottom));
	bottom: max(20cqh, var(--wb-ib, 0px));
	padding: 1rem;
	background-color: #111a30;
	border-left: 3px solid #ff5a4d;
	color: #f4f7ff;
	font-family: Arial, sans-serif;
	font-weight: 400;
	line-height: 1.3;
}
</style>
$GODOT_HEAD_INCLUDE
</head>
<body>
<div id="wb-rotor">
<canvas id="canvas">Your browser does not support the canvas tag.</canvas>
<noscript>Westbound needs JavaScript.</noscript>
<div id="status">
	<div id="wb-brand"><div id="wb-logo">WESTBOUND</div><div id="wb-tag">CHASE THE SUN</div></div>
	<div id="wb-load">
		<div id="wb-phase">LOADING</div>
		<div id="status-progress"><div id="wb-fill"></div><div id="wb-sweep"></div></div>
	</div>
	<div id="status-notice"></div>
</div>
</div>
<div id="wb-safe"></div>
<script>
// Before the engine: the build id, versioned fetches, the AudioContext hook and the
// stale-page check.
(function () {
	'use strict';
	const build = '__WB_BUILD__';
	const known = /^[0-9a-f]{8,}$/.test(build);
	window.wbBuild = known ? build : '';
	// ?v=<build> on the engine's own downloads (index.wasm, index.pck): a new deploy
	// gets new URLs, so the browser never runs a cached wasm with a new pck or the
	// other way round, and never waits out Pages' 10-minute max-age.
	if (known && window.fetch) {
		const plain = window.fetch;
		window.fetch = function (input, init) {
			if (typeof input === 'string' && /^[\w.-]+\.(wasm|pck)$/.test(input)) {
				input = input + '?v=' + build;
			}
			return plain.call(this, input, init);
		};
	}
	// The engine makes one AudioContext; keep it for the audio unlock.
	const AC = window.AudioContext || window.webkitAudioContext;
	if (AC) {
		const Hooked = function (opts) {
			const ctx = new AC(opts);
			window.wbAudioCtx = ctx;
			return ctx;
		};
		Hooked.prototype = AC.prototype;
		if (window.AudioContext) {
			window.AudioContext = Hooked;
		} else {
			window.webkitAudioContext = Hooked;
		}
	}
	// A cached index.html from an older deploy: reload once to get the new one.
	if (known && window.fetch) {
		window.fetch('version.json', { cache: 'no-store' }).then(function (r) {
			return r.ok ? r.json() : null;
		}).then(function (v) {
			if (!v || !v.build || v.build === build) {
				return;
			}
			let tried = '';
			try {
				tried = sessionStorage.getItem('wb-reload') || '';
				sessionStorage.setItem('wb-reload', v.build);
			} catch (e) {
				tried = v.build;   // no storage: never risk a reload loop
			}
			if (tried !== v.build) {
				console.log('Westbound: build ' + v.build + ' is out (this page is ' + build + '); reloading');
				window.location.reload();
			}
		}).catch(function () { });
	}
}());
</script>
<script>
// Landscape only (WP9.7, docs/WEB.md → Landscape only). Westbound is a landscape game.
// On a touch device showing a portrait viewport (a phone held upright, or locked in
// portrait so Safari's toolbars stay small), the game box is sized to the landscape box
// (the viewport's height by its width) and rotated 90° clockwise about its top-left,
// then moved right by the viewport's width, so it covers the viewport exactly and the
// phone's top (the camera) is on the player's left. Desktop browsers and landscape
// viewports are never rotated. ?rotate=0 turns it off, ?rotate=1 also rotates a
// portrait desktop window (for testing).
//
// Input: the engine turns a DOM event into canvas pixels with the canvas' bounding rect
// ((clientX - rect.x) * canvas.width / rect.width, and the same for y), which a rotation
// breaks (the axes swap). While rotated, a capture listener on window (it runs before
// the engine's own listeners) rewrites what the engine reads: clientX/clientY of mouse
// and pointer events (movementX/Y too), and changedTouches of touch events (a list of
// {identifier, clientX, clientY} in the box's frame), and the canvas' bounding rect is
// the box's own (0, 0, width, height). The game sees plain landscape input: multi-touch,
// the browser's touch ids (TouchSlots maps them) and the GUI all work unchanged.
//
// The shell sizes the canvas itself (the engine starts with canvasResizePolicy 0 and
// follows canvas.width/height): CSS size = the box, backing size = box × devicePixelRatio.
// window.wbLayout (src/platform/web_layout.gd reads it): rotated, phone, the box's
// width/height in CSS px, and the page's env(safe-area-inset-*) as il/it/ir/ib (CSS px,
// in the page's own frame; the game maps them into the box).
(function () {
	'use strict';
	// <wb-layout-math> Pure; tools/web_smoke/layout_test.mjs runs this block in node.
	var WBLayoutMath = {
		// Rotate a touch device's portrait viewport; force: true/false from ?rotate=1/0.
		shouldRotate: function (touch, vw, vh, force) {
			if (force === false) { return false; }
			return (touch || force === true) && vh > vw;
		},
		// The landscape box (CSS px) for a vw × vh viewport.
		box: function (vw, vh, rotated) {
			return rotated ? [vh, vw] : [vw, vh];
		},
		// The box's CSS transform (transform-origin 0 0): a box point (x, y) lands on
		// the client point (vw - y, x).
		transform: function (vw, rotated) {
			return rotated ? 'translate(' + vw + 'px, 0px) rotate(90deg)' : '';
		},
		// A client point in the box's frame; r = the box's bounding rect on the page.
		toBox: function (cx, cy, r, rotated) {
			return rotated ? [cy - r.top, r.right - cx] : [cx - r.left, cy - r.top];
		},
		// A movement (dx, dy) on the page in the box's frame.
		deltaToBox: function (dx, dy, rotated) {
			return rotated ? [dy, -dx] : [dx, dy];
		},
		// The inverse of toBox (the smoke test taps a box point).
		toClient: function (bx, by, r, rotated) {
			return rotated ? [r.right - by, r.top + bx] : [r.left + bx, r.top + by];
		},
		// The page's insets [left, top, right, bottom] in the box's frame: its left
		// edge is the page's top, its top the page's right, and so on.
		insetsToBox: function (ins, rotated) {
			return rotated ? [ins[1], ins[2], ins[3], ins[0]] : ins.slice();
		},
		// ?rotate=0|1 → false/true; anything else null.
		force: function (search) {
			var m = /[?&]rotate=([01])(&|$)/.exec(search || '');
			return m ? m[1] === '1' : null;
		}
	};
	// </wb-layout-math>
	var M = WBLayoutMath;
	// A phone (the game keeps a minimum left inset): a short screen side in CSS px.
	var PHONE_MAX_SHORT_SIDE = 600;
	var rotor = document.getElementById('wb-rotor');
	var canvas = document.getElementById('canvas');
	var safe = document.getElementById('wb-safe');
	var coarse = window.matchMedia ? window.matchMedia('(pointer: coarse)') : null;
	var force = M.force(window.location.search);
	var rectOf = Element.prototype.getBoundingClientRect;
	var L = {
		rotated: false, touch: false, phone: false, width: 0, height: 0,
		il: 0, it: 0, ir: 0, ib: 0, version: 0, math: M
	};
	window.wbLayout = L;

	function isTouch() {
		return !!(coarse && coarse.matches) || /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
	}

	function px(v) {
		var n = parseFloat(v);
		return isFinite(n) ? n : 0;
	}

	function apply() {
		var vv = window.visualViewport;
		var vw = Math.round((vv && vv.width) || window.innerWidth);
		var vh = Math.round((vv && vv.height) || window.innerHeight);
		if (!vw || !vh) { return; }
		L.touch = isTouch();
		var rot = M.shouldRotate(L.touch, vw, vh, force);
		var b = M.box(vw, vh, rot);
		var dpr = window.devicePixelRatio || 1;
		rotor.style.width = b[0] + 'px';
		rotor.style.height = b[1] + 'px';
		rotor.style.transform = M.transform(vw, rot);
		canvas.style.width = b[0] + 'px';
		canvas.style.height = b[1] + 'px';
		var bw = Math.max(1, Math.round(b[0] * dpr));
		var bh = Math.max(1, Math.round(b[1] * dpr));
		// Assigning the size clears the drawing buffer even when it is the same.
		if (canvas.width !== bw) { canvas.width = bw; }
		if (canvas.height !== bh) { canvas.height = bh; }
		var cs = window.getComputedStyle(safe);
		var ins = [px(cs.paddingLeft), px(cs.paddingTop), px(cs.paddingRight), px(cs.paddingBottom)];
		var bi = M.insetsToBox(ins, rot);
		rotor.style.setProperty('--wb-il', bi[0] + 'px');
		rotor.style.setProperty('--wb-ir', bi[2] + 'px');
		rotor.style.setProperty('--wb-ib', bi[3] + 'px');
		var changed = rot !== L.rotated || b[0] !== L.width || b[1] !== L.height;
		L.rotated = rot;
		L.width = b[0];
		L.height = b[1];
		L.il = ins[0];
		L.it = ins[1];
		L.ir = ins[2];
		L.ib = ins[3];
		L.phone = L.touch && Math.min(window.screen.width, window.screen.height) <= PHONE_MAX_SHORT_SIDE;
		L.version += 1;
		document.documentElement.classList.toggle('wb-rotated', rot);
		if (changed) {
			console.log('Westbound layout: ' + (rot ? 'rotated' : 'landscape') + ' ' + b[0] + 'x' + b[1]
				+ ' (viewport ' + vw + 'x' + vh + ', dpr ' + dpr + ', insets ' + ins.join(',') + ')');
		}
	}

	// The engine reads the canvas' rect for every event: the box's own while rotated.
	canvas.getBoundingClientRect = function () {
		if (!L.rotated) { return rectOf.call(canvas); }
		return new DOMRect(0, 0, L.width, L.height);
	};

	function define(o, key, value) {
		Object.defineProperty(o, key, { value: value, configurable: true, enumerable: true });
	}

	function onPoint(e) {
		if (!L.rotated) { return; }
		var p = M.toBox(e.clientX, e.clientY, rectOf.call(rotor), true);
		define(e, 'clientX', p[0]);
		define(e, 'clientY', p[1]);
		if (typeof e.movementX === 'number') {
			var d = M.deltaToBox(e.movementX, e.movementY, true);
			define(e, 'movementX', d[0]);
			define(e, 'movementY', d[1]);
		}
	}

	function onTouch(e) {
		if (!L.rotated || !e.changedTouches) { return; }
		var r = rectOf.call(rotor);
		var list = e.changedTouches;
		var out = [];
		for (var i = 0; i < list.length; i++) {
			var t = list[i];
			var p = M.toBox(t.clientX, t.clientY, r, true);
			out.push({ identifier: t.identifier, clientX: p[0], clientY: p[1], target: t.target, force: t.force });
		}
		define(e, 'changedTouches', out);
	}

	var opts = { capture: true, passive: true };
	['mousedown', 'mouseup', 'mousemove', 'pointerdown', 'pointermove', 'pointerup', 'click'].forEach(function (t) {
		window.addEventListener(t, onPoint, opts);
	});
	['touchstart', 'touchmove', 'touchend', 'touchcancel'].forEach(function (t) {
		window.addEventListener(t, onTouch, opts);
	});

	var later = 0;
	function soon() {
		apply();
		// iOS reports the new viewport a moment after the rotation.
		clearTimeout(later);
		later = setTimeout(apply, 250);
	}
	window.addEventListener('resize', apply);
	window.addEventListener('orientationchange', soon);
	if (window.visualViewport) { window.visualViewport.addEventListener('resize', apply); }
	if (window.screen && screen.orientation && screen.orientation.addEventListener) {
		screen.orientation.addEventListener('change', soon);
	}
	if (coarse && coarse.addEventListener) { coarse.addEventListener('change', apply); }
	apply();
}());
</script>
<script src="$GODOT_URL?v=__WB_BUILD__"></script>
<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;

(function () {
	'use strict';
	const status = document.getElementById('status');
	const phase = document.getElementById('wb-phase');
	const fill = document.getElementById('wb-fill');
	const notice = document.getElementById('status-notice');
	let done = false;

	function setPhase(text, starting) {
		phase.textContent = text;
		status.classList.toggle('starting', !!starting);
	}

	function hide() {
		if (done) {
			return;
		}
		done = true;
		status.classList.add('gone');
		setTimeout(function () { status.remove(); }, 300);
	}

	window.wbFail = function (err) {
		console.error(err);
		const text = err instanceof Error ? err.message : (typeof err === 'string' ? err : 'An unknown error occurred.');
		while (notice.lastChild) {
			notice.removeChild(notice.lastChild);
		}
		text.split('\n').forEach(function (line) {
			notice.appendChild(document.createTextNode(line));
			notice.appendChild(document.createElement('br'));
		});
		notice.style.display = 'block';
		setPhase('COULD NOT START', false);
		done = true;
	};

	function start() {
		const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
		if (missing.length !== 0) {
			window.wbFail('Westbound needs a browser with:\n' + missing.join('\n'));
			return;
		}
		// The layout script sizes the canvas (landscape only, WP9.7): the engine follows it.
		GODOT_CONFIG.canvasResizePolicy = 0;
		const engine = new Engine(GODOT_CONFIG);
		let started = false;
		engine.startGame({
			'onProgress': function (current, total) {
				if (total > 0) {
					const f = Math.min(current / total, 1);
					fill.style.transform = 'scaleX(' + f.toFixed(4) + ')';
					if (f >= 1 && !started) {
						started = true;
						setPhase('STARTING', true);
					} else if (!started) {
						setPhase('LOADING ' + Math.floor(f * 100) + '%', false);
					}
				} else if (!started) {
					setPhase('LOADING', true);
				}
			},
		}).then(hide, window.wbFail);
	}

	// The game marks its first title (or run) frame (src/platform/web_boot.gd): the
	// loading screen can go then, even before startGame() resolves.
	window.addEventListener('wb-boot', function (e) {
		if (e.detail === 'title' || e.detail === 'run') {
			hide();
		}
	});

	if (typeof Engine === 'undefined') {
		window.wbFail('Could not load the game engine ($GODOT_URL).');
	} else {
		start();
	}
}());
</script>
</body>
</html>
