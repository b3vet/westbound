name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      tier:
        description: "Test tier (fast | soak | all)"
        default: "fast"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: ~/.cache/westbound
          key: godot-4.7-stable-linux
      - name: Lint
        run: |
          tools/lint --self-test
          tools/lint
      - name: Headless tests
        run: tools/test.sh --tier=${{ github.event.inputs.tier || 'fast' }}
