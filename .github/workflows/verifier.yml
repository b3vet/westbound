name: Verifier

# The replay verifier image (WP N8.3): ghcr.io/<owner>/westbound-verifier:{edge,<branch>-<sha>}.
# docs/DETERMINISM.md → Verifier deploy; the owner's steps: docs/OPERATIONS.md → Replay
# verification.
#
# One job, built from this commit only:
#   1. the headless verifier export of this commit's game (tools/verifier/export_verifier.sh,
#      smoke-tested: the exported binary accepts a fresh replay), for NetTuning.client_build;
#   2. the verifiers of older client builds carried over from the previous :edge image
#      (tools/verifier/carry_builds.sh, the newest KEEP_BUILDS), and a build-parity check
#      (the previous verifier of the same build number must accept this commit's replay,
#      else a warning: the simulation changed without a client_build bump);
#   3. the westbound-server binary built from this commit's source (not :edge: the server
#      image is only rebuilt on westbound-server/ changes, and when both change in one push
#      server.yml may not have pushed yet; building here keeps the worker's code and queries
#      exactly this commit's, with the server workflow's layer cache);
#   4. the image (westbound-server/verifier/Dockerfile, context build/verifier), then an
#      end-to-end smoke test (tools/verifier/smoke_image.py: server + sidecar on one volume;
#      honest replay verified, teleported and inflated ones rejected, a build without a
#      verifier set aside) before anything is pushed.
# The web build (web.yml) deploys the same commits' game, so the image always holds the
# verifier for the build players are served.

on:
  push:
    branches:
      - claude/game-implementation-phases-asl5jz
    paths:
      - "src/**"
      - "data/**"
      - "assets/**"
      - "tools/verifier/**"
      - "export_presets.cfg"
      - "project.godot"
      - "westbound-server/**"
      - ".github/workflows/verifier.yml"
  workflow_dispatch:
    inputs:
      keep_builds:
        description: "Client builds kept in the image (1 = only this commit's build: older builds' replays are set aside)"
        default: "3"

permissions:
  contents: read

# One at a time, the newest wins: an older run never overwrites :edge after a newer one.
concurrency:
  group: verifier-${{ github.ref }}
  cancel-in-progress: true

env:
  PUSH_BRANCH: claude/game-implementation-phases-asl5jz
  # Client builds kept in the image (the fresh one plus the newest older ones).
  KEEP_BUILDS: ${{ github.event.inputs.keep_builds || '3' }}

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Image names
        id: meta
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          branch="${GITHUB_REF_NAME//\//-}"
          sha="${GITHUB_SHA::7}"
          image="ghcr.io/${owner}/westbound-verifier"
          push=false
          if [[ "${GITHUB_REF_NAME}" == "${PUSH_BRANCH}" ]]; then
            push=true
          fi
          {
            echo "image=${image}"
            echo "sha=${sha}"
            echo "tag=${branch}-${sha}"
            echo "push=${push}"
          } >> "$GITHUB_OUTPUT"

      # Godot binary + the Linux debug export template (about 150 MB; not the 1.3 GB of
      # every platform's templates).
      - name: Cache Godot and the Linux template
        uses: actions/cache@v4
        with:
          path: ~/.cache/westbound
          key: godot-4.7-stable-verifier-linux-${{ hashFiles('tools/godot.sh', 'tools/export_templates.sh', 'tools/verifier/install_linux_template.sh') }}
          restore-keys: |
            godot-4.7-stable-verifier-linux-
            godot-4.7-stable-linux

      - name: Export the verifier (and verify a fresh replay with it)
        run: tools/verifier/export_verifier.sh --keep-sample=build/verifier-sample

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Carry older client builds over from the previous image
        run: |
          tools/verifier/carry_builds.sh --from-image="${{ steps.meta.outputs.image }}:edge" \
            --keep="${KEEP_BUILDS}" --sample=build/verifier-sample

      - uses: docker/setup-buildx-action@v3
        id: buildx

      # This commit's server binary (the verify-worker), with server.yml's layer cache.
      - name: Build the server image from source
        uses: docker/build-push-action@v6
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: westbound-server
          platforms: linux/amd64
          build-args: WB_BUILD=${{ steps.meta.outputs.sha }}
          tags: westbound-server:verifier-ci
          load: true
          cache-from: |
            type=gha,scope=westbound-server
            type=gha,scope=westbound-verifier-server
          cache-to: type=gha,scope=westbound-verifier-server,mode=max

      # The Docker engine's own builder: it sees the server image loaded above
      # (FROM ${SERVER_IMAGE}). Small layers, no cache needed.
      - name: Build the verifier image
        uses: docker/build-push-action@v6
        with:
          builder: default
          context: build/verifier
          file: westbound-server/verifier/Dockerfile
          build-args: SERVER_IMAGE=westbound-server:verifier-ci
          tags: westbound-verifier:ci
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          load: true

      - name: Smoke test the image (server + sidecar, honest and tampered replays)
        run: |
          python3 tools/verifier/smoke_image.py --verifier-image=westbound-verifier:ci \
            --server-image=westbound-server:verifier-ci --sample=build/verifier-sample
          docker image ls westbound-verifier:ci --format 'image size: {{.Size}}'

      - name: Push
        if: steps.meta.outputs.push == 'true'
        run: |
          image="${{ steps.meta.outputs.image }}"
          for t in edge "${{ steps.meta.outputs.tag }}"; do
            docker tag westbound-verifier:ci "${image}:${t}"
            docker push "${image}:${t}"
          done
          {
            echo "### Pushed"
            echo
            echo "- \`${image}:edge\`"
            echo "- \`${image}:${{ steps.meta.outputs.tag }}\` (rollback tag)"
          } >> "$GITHUB_STEP_SUMMARY"

      # Optional: the Coolify resource's deploy webhook (docs/OPERATIONS.md → Replay
      # verification → Updating). Without the two secrets: redeploy it in Coolify by hand.
      - name: Redeploy the verifier on Coolify
        if: steps.meta.outputs.push == 'true'
        env:
          COOLIFY_VERIFIER_WEBHOOK: ${{ secrets.COOLIFY_VERIFIER_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [[ -z "${COOLIFY_VERIFIER_WEBHOOK}" || -z "${COOLIFY_TOKEN}" ]]; then
            echo "No COOLIFY_VERIFIER_WEBHOOK / COOLIFY_TOKEN secrets: redeploy the verifier in Coolify."
            exit 0
          fi
          curl -fsS --retry 3 -H "Authorization: Bearer ${COOLIFY_TOKEN}" "${COOLIFY_VERIFIER_WEBHOOK}"
          echo
