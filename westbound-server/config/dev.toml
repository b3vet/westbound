# Local development: `cargo run -p server -- --config config/dev.toml` from
# westbound-server/. Everything else keeps the defaults (config/server.example.toml).

[server]
# dev: empty auth secrets fall back to public development values (never in production).
env = "dev"
bind = "127.0.0.1:8080"
public_origin = "https://localhost:8443"
# N10.2: a short restart notice for local runs (a second Ctrl-C skips it).
restart_notice_secs = 5
restart_notice_reminders_secs = []

[log]
level = "info,westbound_server=debug"

[db]
path = "dev-data/westbound.db"

[backup]
dir = "dev-data/backups"

[http]
cors_allowed_origins = ["*"]

[rate_limits]
# Local clients create many accounts while testing.
device_create_per_hour = 1000
device_create_burst = 100
# N10.2: local bots (load tests) all come from 127.0.0.1.
ip_per_minute = 100000
ip_burst = 10000
ws_connect_per_minute = 100000
ws_connect_burst = 10000

[deeplinks]
# Invite links on a local run open a web build served on :8000 against this server
# (tools/export_web.sh, then `python3 -m http.server 8000` in build/web). Placeholder app
# ids so the association files show their real shape (docs/SERVER.md → deep links).
web_join_url = "http://127.0.0.1:8000/index.html?room={code}&server={origin}"
apple_app_ids = ["ABCDE12345.com.b3vet.westbound"]
android_package = "com.b3vet.westbound"
android_cert_sha256 = ["00:11:22:33:44:55:66:77:88:99:AA:BB:CC:DD:EE:FF:00:11:22:33:44:55:66:77:88:99:AA:BB:CC:DD:EE:FF"]

[gateway]
# dev with no map hashes: /ws accepts any Hello.map_hash (tests/net/live_ws_check.gd sends
# all zeros). N3 adds loop_v1's hash here and to production.
map_hashes = []

[replays]
dir = "dev-data/replays"
# Local verification with the editor binary (from westbound-server/; see docs/SERVER.md):
# verifier_command = ["nice", "-n", "10", "../tools/godot.sh", "--headless", "--path", "..",
#   "--script", "res://tools/verifier/verify_replay.gd", "--", "--replay={replay}",
#   "--out={out}", "--seed={seed}", "--claimed-score={claimed_score}",
#   "--claimed-hits={claimed_hits}"]
