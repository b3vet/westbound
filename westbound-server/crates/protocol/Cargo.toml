[package]
name = "protocol"
description = "Westbound Online wire protocol: message types, binary codec, handshake, golden vectors"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bytes = "1.12.1"
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"

[dev-dependencies]
proptest = "1.11.0"

[[bin]]
name = "gen_vectors"
path = "src/bin/gen_vectors.rs"
