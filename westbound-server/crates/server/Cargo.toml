[package]
name = "server"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "westbound_server"
path = "src/lib.rs"

[[bin]]
name = "westbound-server"
path = "src/main.rs"

[dependencies]
protocol.workspace = true
sim.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "matched-path", "tokio", "tracing", "ws"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
sqlx = { version = "0.9.0", default-features = false, features = ["macros", "migrate", "runtime-tokio", "sqlite-bundled"] }
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
toml = "1.1.6"
tower = { version = "0.5.3", default-features = false, features = ["util"] }
tower-http = { version = "0.7.1", features = ["compression-gzip", "cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
# Same version as axum's WebSocket backend: used only to recognise its "message too
# big" error (ws.rs, `is_oversize`). The oversize test fails if the versions drift.
tungstenite = { version = "0.29.0", default-features = false }
# N1.1 accounts: tokens, hashing, randomness, rate limits. hmac, sha2 and base64 match
# the versions jsonwebtoken uses, so the binary carries one copy of each.
base64 = "0.22.1"
getrandom = "0.3.4"
hmac = "0.12.1"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto"] }
sha2 = "0.10.9"
subtle = "2.6.1"
tower_governor = { version = "0.8.0", default-features = false, features = ["axum"] }
governor = { version = "0.10.4", default-features = false, features = ["std", "dashmap", "quanta", "jitter"] }
# N11 identity providers: JWKS fetches, Apple's token and revoke endpoints. rustls with
# the bundled webpki roots (no system CA bundle needed; the musl image stays static).
reqwest = { version = "0.12.24", default-features = false, features = ["rustls-tls-webpki-roots"] }

# N10.3: free space on the data volume (statvfs; the linux_raw backend needs no libc, so
# the static musl image is fine).
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", features = ["fs"] }

[dev-dependencies]
# N5.1: scripted room clients for the rooms integration tests and bench.
bots = { path = "../bots" }
tempfile = "3.27.0"
tokio-tungstenite = "0.29.0"
