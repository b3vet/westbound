<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta property="og:title" content="Westbound: drive the loop together">
<meta property="og:description" content="An invite to a Westbound room or party.">
<title>Westbound invite</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; min-height: 100%; background: #140f1c; color: #f3ead8;
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 48px 16px; }
  .brand { letter-spacing: .3em; font-size: 13px; color: #f0a24a; }
  h1 { font-size: 34px; letter-spacing: .04em; margin: 12px 0 8px; font-style: italic; }
  h1 b { color: #ffcf5a; font-style: normal; letter-spacing: .12em; }
  p { color: #c9bfd6; margin: 0 0 28px; }
  .actions { display: flex; flex-direction: column; gap: 12px; }
  a, .soon { display: block; min-height: 48px; line-height: 48px; padding: 0 18px;
    border: 1px solid #5c4a73; border-radius: 4px; color: #f3ead8; text-decoration: none;
    letter-spacing: .08em; font-weight: 600; }
  a.primary { background: #f0a24a; border-color: #f0a24a; color: #140f1c; }
  .soon { color: #8a7f98; border-style: dashed; font-weight: 400; }
</style>
</head>
<body>
<main>
  <div class="brand">WESTBOUND</div>
  <h1>{{heading}}</h1>
  <p>{{body}}</p>
  <div class="actions">{{actions}}</div>
</main>
</body>
</html>
