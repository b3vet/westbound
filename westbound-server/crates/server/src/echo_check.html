<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Westbound echo check</title>
<style>
  :root { color-scheme: light dark; --ok: #1a7f37; --bad: #cf222e; }
  body { font: 16px/1.5 system-ui, sans-serif; margin: 0 16px; max-width: 40rem; }
  h1 { font-size: 1.25rem; }
  pre { white-space: pre-wrap; word-break: break-word; }
  .ok { color: var(--ok); font-weight: 600; }
  .bad { color: var(--bad); font-weight: 600; }
  button { font: inherit; padding: 0.5rem 1rem; }
</style>
</head>
<body>
<h1>Westbound server: WebSocket check</h1>
<p>Checks <code>/api/v1/health</code>, sends a binary message over <code>/ws/echo</code> and waits for the echo, then sends a protocol <code>Hello</code> without a token to the game gateway on <code>/ws</code> and expects its <code>Error</code> answer (<code>map_mismatch</code> or <code>auth_failed</code>).</p>
<p id="result">Running...</p>
<pre id="log"></pre>
<button id="again" type="button">Run again</button>
<script>
(() => {
  const log = document.getElementById('log');
  const result = document.getElementById('result');
  const say = (line) => { log.textContent += line + '\n'; };
  const done = (ok, text) => { result.className = ok ? 'ok' : 'bad'; result.textContent = text; };
  async function run() {
    log.textContent = '';
    result.className = '';
    result.textContent = 'Running...';
    try {
      const health = await fetch('/api/v1/health', { cache: 'no-store' }).then((r) => r.json());
      say('health: ' + JSON.stringify(health));
    } catch (e) {
      say('health failed: ' + e);
    }
    const base = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host;
    let echo;
    try {
      echo = await echoCheck(base + '/ws/echo');
    } catch (e) {
      done(false, 'FAIL: ' + e.message);
      return;
    }
    let gateway;
    try {
      gateway = await gatewayCheck(base + '/ws');
    } catch (e) {
      done(false, 'FAIL: gateway: ' + e.message);
      return;
    }
    done(true, 'OK: echo over ' + base + '/ws/echo in ' + echo + ' ms; gateway answered ' + gateway);
  }

  // Sends 1024 bytes, expects them back; resolves with the round trip in ms.
  function echoCheck(url) {
    say('connecting ' + url);
    const payload = new Uint8Array(1024).map((_, i) => (i * 31 + 7) % 256);
    return new Promise((resolve, reject) => {
      const ws = new WebSocket(url);
      ws.binaryType = 'arraybuffer';
      let t0 = 0;
      const timer = setTimeout(() => { reject(new Error('echo timeout')); ws.close(); }, 10000);
      ws.onopen = () => { t0 = performance.now(); say('open, sending 1024 bytes'); ws.send(payload); };
      ws.onerror = () => say('websocket error');
      ws.onclose = (e) => { clearTimeout(timer); say('closed: code ' + e.code); reject(new Error('closed before the echo')); };
      ws.onmessage = (e) => {
        if (!(e.data instanceof ArrayBuffer)) return;
        const back = new Uint8Array(e.data);
        const same = back.length === payload.length && back.every((b, i) => b === payload[i]);
        const rtt = Math.round(performance.now() - t0);
        clearTimeout(timer);
        ws.onclose = null;
        ws.close(1000);
        if (same) { say('echo ok in ' + rtt + ' ms'); resolve(rtt); } else { reject(new Error('echo differs')); }
      };
    });
  }

  // docs/PROTOCOL.md: Hello = [0x01][u16 len][u16 version][u32 build][32-byte map hash][u16 token len].
  // With no token the gateway must answer a fatal Error (0x42: code u8, fatal u8, detail str8).
  const ERROR_CODES = ['update_required', 'server_outdated', 'map_mismatch', 'auth_failed', 'banned',
    'handshake_required', 'malformed', 'rate_limited', 'server_full', 'room_not_found', 'room_full',
    'party_not_found', 'party_full', 'not_host', 'not_party_leader', 'not_in_room', 'already_in_room',
    'blocked', 'not_allowed', 'internal'];
  function gatewayCheck(url) {
    say('connecting ' + url);
    const hello = new Uint8Array(3 + 40);
    const v = new DataView(hello.buffer);
    v.setUint8(0, 0x01);
    v.setUint16(1, 40, true);
    v.setUint16(3, 1, true);   // protocol version 1
    return new Promise((resolve, reject) => {
      const ws = new WebSocket(url);
      ws.binaryType = 'arraybuffer';
      const timer = setTimeout(() => { reject(new Error('no answer to Hello')); ws.close(); }, 10000);
      ws.onopen = () => { say('open, sending Hello without a token'); ws.send(hello); };
      ws.onerror = () => say('websocket error');
      ws.onclose = (e) => { clearTimeout(timer); say('closed: code ' + e.code); reject(new Error('closed without an answer')); };
      ws.onmessage = (e) => {
        if (!(e.data instanceof ArrayBuffer)) return;
        const b = new DataView(e.data);
        clearTimeout(timer);
        ws.onclose = (c) => say('closed: code ' + c.code + ' ' + c.reason);
        if (b.byteLength >= 5 && b.getUint8(0) === 0x42) {
          const code = ERROR_CODES[b.getUint8(3)] || ('code ' + b.getUint8(3));
          say('gateway: Error ' + code + (b.getUint8(4) ? ' (fatal)' : ''));
          resolve('Error ' + code);
        } else {
          reject(new Error('unexpected answer, type 0x' + b.getUint8(0).toString(16)));
        }
        ws.close(1000);
      };
    });
  }

  document.getElementById('again').addEventListener('click', run);
  run();
})();
</script>
</body>
</html>
